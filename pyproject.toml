[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dna-maker-agent"
version = "0.1.0"
description = "MCP orchestration layer for reproducible DNA-engineering workflows"
requires-python = ">=3.11"
# MCP 1.10 provides the stdio FastMCP API used here without pulling the
# optional cryptography build required by newer releases on Python 3.14.
dependencies = ["mcp>=1.10,<1.11"]

[project.scripts]
dna-maker-mcp = "agent.server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["agent*", "snapgene*", "biology*"]
